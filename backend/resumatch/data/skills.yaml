# Skill dictionary used for extraction.
#
# Matching rule: an alias written in lowercase is matched case-insensitively,
# an alias with any capital letter is matched exactly. That's how "React" (the
# library) is kept apart from "react to incidents", or "Go" from "go-to".
#
# `implies` lists skills that someone who uses this one clearly has, e.g. a
# PostgreSQL user knows SQL. Implied skills show up as "implied", not "found".

languages:
  - name: Python
    aliases: [python, python3]
  - name: Java
    aliases: [Java, JAVA]
  - name: JavaScript
    aliases: [javascript, js, ecmascript, es6]
  - name: TypeScript
    aliases: [typescript, ts]
  - name: C++
    aliases: [c++, cpp]
